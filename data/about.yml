enable  : true
title   : RNA regulation in childhood cancer
image   : images/transcription-translation.png
description: >
  Gene expression is a highly dynamic process. To regulate RNA synthesis and degradation, cells have a variety of tools for regulating gene expression.
  <br /><br />
  However, <b>many childhood cancers are driven by loss of these regulatory tools</b>. For example, loss of one of these tools, known as microRNAs, can lead to a variety of rare childhood tumors. Many other cancers bear mutations in transcription factors, the proteins that give a cell its identity by determining which genes are expressed. Yet other cancers are driven by mutations in another regulatory tool, the chromatin remodeling complexes.
  <br />  <br />
  <b>We study how dysregulation of RNA synthesis and degradation drives childhood cancers</b> with the ultimate goal of identifying new therapeutic vulnerabilities to exploit in treating them.
  <br /> <br />
  Scroll down to learn more.

aboutItem:
  - title : Childhood kidney cancer
    image : images/kidney-tumor-rna.png
    description: >
      Wilms tumor is the most common pediatric kidney cancer. Many are driven by mutations in transcription factors, chromatin remodeling factors, or microRNA processing genes. We are studying how these mutations affect gene expression and drive tumor formation. We are performing these studies both <i>in vitro</i>, with cell-line models, and <i>in vivo</i>, generating genetically-engineered mouse models of Wilms tumor mutations. In addition, we are continuing to sequence Wilms tumors in order to fully describe the landscape of gene dysregulation mechanisms in Wilms tumor.

  - title : <i>DICER1</i> mutations
    image : images/dicer1-syndrome.png
    description: >
      One particular gene which regulates gene expression, known as <i>DICER1</i>, can be mutated in wide range of rare cancers. <i>DICER1</i> is one of the key enzymes in microRNA production. In fact, some children are born with mutations in <i>DICER1</i> that predispose them to developing cancer. However, no therapies have been developed for <i>DICER1</i>-related cancers. We seek to understand how <i>DICER1</i> cancers arise, using both <i>in vitro</i> and <i>in vivo</i> models.

  - title : Chemoresistance
    image : images/rawpixel-600792-unsplash.jpg
    description: >
      Dactinomycin, an inhibitor of transcription (RNA production), is one of the most commonly used chemotherapy drugs for childhood cancers including Wilms tumor, rhabdomyosarcoma, and pleuropulmonary blastoma. It is effective for many patients. However, most tumors that are resistant to front-line therapy become impossible to treat. We are investigating how tumors evade transcriptional inhibition and ways to target these escape mechanisms.
