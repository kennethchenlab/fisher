baseURL = "https://www.kennethchenlab.com/"
languageCode = "en-us"
title = "Chen lab"
theme = "timer-hugo"

# We Used Ionicons Icon font for Icon, for more details check this link - https://ionicons.com/v2/

# Site Menus
[menu]
    # Navbar Menus
    [[menu.nav]]
        name    = "Research"
        url     = "/about"
        weight  = 2
    [[menu.nav]]
        name    = "Publications"
        url     = "/publications"
        weight  = 3
    [[menu.nav]]
        name    = "Members"
        url     = "/members"
        weight  = 4
   [[menu.nav]]
        name    = "Contact"
        url     = "/contact"
        weight  = 5

# Site Params
[params]
    home = "Home"
    dateFormat = "6 January 2006"
    #
    # You can use either an image or text as logo.
    # To use an image use 'logo' (logo itself) and 'logo_alt' (alternative text if image cannot displayed)
    # To use text as logo use 'logo_text'
    # logo = "images/logo.png"
    # logo_alt = "logo"
    logo_text = "CHEN LAB"

    # Banner Section
    [params.banner]
        enable  = true
        bgImage = "images/rawpixel-781987-unsplash.jpg"
        heading = "Chen lab"
        description = "We study how RNA dysregulation drives childhood cancer."
        btn     = true
        btnText = "View research"
        btnURL  = "/about"
        # [[params.banner.flipText]]
        #     title   = "DESIGNER"
        # [[params.banner.flipText]]
        #     title   = "DEVELOPER"
        # [[params.banner.flipText]]
        #     title   = "FATHER"

    # Homepage About Section
    [params.about]
        enable  = true
        title   = "OUR RESEARCH"
        content = "The messages that tell our cells which proteins to make are called messenger RNA, or mRNA. Making and degrading mRNA is tightly regulated, but in some childhood cancers, this regulation is lost. We study how broken mRNA degradation leads to childhood cancer, and we seek ways to exploit this as a therapeutic vulnerability. <br /><br /> Click <a href=/about>here</a> to learn more."
        image   = "images/pipet-louis-reed-747388-unsplash.jpg"

    # Call to Action
    [params.cta]
        enable  = true
        title   = "JOIN US"
        content = "Want to help us understand childhood cancer?"
        btnText = "Contact us"
        btnURL  = "/contact"

    # Portfolio Section On Homepage
    [params.portfolio]
        enable  = false
        title   = "RESEARCH INTERESTS"
        subtitle= "We study"

    # Feature Product Section
    [params.featureProduct]
        enable  = true
        title   = "SOME OF OUR FEATURED WORKS"
        subtitle= "subtitle"

    # Footer section
    [params.footer]
        customized  = true # Set this variable to true if you customized the design.
        copyright_owner = "Chen lab"
        copyright_since = "2019"
        [[params.footer.social]]
            icon = "ion-social-twitter"
            link = "https://twitter.com/kennethschen"
        [[params.footer.social]]
            icon = "ion-social-github"
            link = "https://github.com/kennethchenlab"
